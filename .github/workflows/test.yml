name: Build and test

on:
  push:
  pull_request:

jobs:
  cmake:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev

  legacy-make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime with the inherited Makefiles
        run: |
          make -C src clean
          CFLAGS='-std=gnu89 -fcommon' make -C src libs
          CFLAGS='-std=gnu89 -fcommon' make -C src/anal cruncher
