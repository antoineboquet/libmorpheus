name: Linux CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ ! startsWith(github.ref, 'refs/tags/') }}

jobs:
  cmake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev

      - name: Test runtime-data preparation helper
        env:
          MORPHEUS_RUNTIME_DATA_BUILD_DIR: build/dev
        run: |
          sh tools/prepare-runtime-data.sh build/runtime-data-test
          test -d build/runtime-data-test/Greek
          test -f build/runtime-data-test/MORPHEUS-DATA.txt
          cmake -E sha256sum build/runtime-data-test/gener.index | \
            grep -F '5aa76d8c86c54af5121a3cce506ecaa57d14c6667ac0f091efd164ddfa9822d6'

  release:
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure optimized release
        run: cmake --preset release -DBUILD_TESTING=ON

      - name: Build optimized release
        run: cmake --build --preset release

      - name: Test optimized release and installed surface
        run: ctest --preset release

  sanitizers:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure sanitizers
        run: cmake --preset sanitizers

      - name: Build sanitizers
        run: cmake --build --preset sanitizers

      - name: Test sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset sanitizers

  thread-sanitizer:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure ThreadSanitizer
        run: cmake --preset thread-sanitizer

      - name: Build ThreadSanitizer
        run: cmake --build --preset thread-sanitizer

      - name: Test ThreadSanitizer
        run: ctest --preset thread-sanitizer

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Dry-run JSR package
        working-directory: bindings/deno
        run: |
          deno lint --rules-include=no-slow-types mod.ts
          deno publish --dry-run

      - name: Configure library
        run: cmake --preset dev

      - name: Build library
        run: cmake --build --preset dev

      - name: Prepare Deno generation fixture
        run: >-
          build/dev/morpheus_gener_index_builder
          stemlib/gener.index
          test/generation-service-source.txt

      - name: Package Deno binding
        run: >-
          cmake
          -DMORPHEUS_SOURCE_DIR=${{ github.workspace }}
          -DMORPHEUS_BUILD_DIR=${{ github.workspace }}/build/dev
          -DMORPHEUS_PACKAGE_DIR=${{ github.workspace }}/build/dev/packages
          -P test/package-deno-binding.cmake

      - name: Verify standalone Deno binding package
        run: >-
          cmake
          -DMORPHEUS_BUILD_DIR=${{ github.workspace }}/build/dev
          -DMORPHEUS_PACKAGE_DIR=${{ github.workspace }}/build/dev/packages
          -P test/test-deno-binding-package.cmake

      - name: Check binding and benchmark runner
        run: |
          sh -n bench/release.sh
          deno check bindings/deno/mod.ts bindings/deno/mod_test.ts \
            bindings/deno/data.ts bindings/deno/data_test.ts \
            bindings/deno/init.ts bindings/deno/init_test.ts \
            bindings/deno/native.ts bindings/deno/native_test.ts \
            bindings/deno/gener_preparer_test.ts \
            bench/compare.ts bench/compare_test.ts \
            bench/validate.ts bench/validate_test.ts

      - name: Test binding
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/dev/libmorpheus.so
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
        run: >-
          deno test --allow-env --allow-ffi --allow-read --allow-write
          bindings/deno/mod_test.ts bindings/deno/data_test.ts
          bindings/deno/init_test.ts
          bindings/deno/native_test.ts
          bindings/deno/gener_preparer_test.ts
          bench/compare_test.ts
          bench/validate_test.ts

      - name: Validate accepted release benchmark evidence
        run: |
          (cd bench/release-evidence && sha256sum -c benchmark-0.3.0.json.sha256)
          deno run --allow-read bench/validate.ts \
            bench/release-evidence/benchmark-0.3.0.json \
            --label release-candidate \
            --revision 66e656d27aedce04cc7b96fe84aff3aca8a35afd \
            --stemlib-revision 4632415fe93c85e9fdca47a0c5a13f31385f0023 \
            --compiler 'Apple clang version 21.0.0 (clang-2100.1.1.101)'

      - name: Acquire and verify pinned Deno datasets
        run: |
          deno run --allow-net=codeload.github.com \
            --allow-read=build --allow-write=build \
            bindings/deno/data.ts --dataset alpheios \
            --with-gener \
            --output build/data-test-alpheios
          deno run --allow-net=codeload.github.com \
            --allow-read=build --allow-write=build \
            bindings/deno/data.ts --dataset perseids \
            --output build/data-test-perseids
          test -f build/data-test-alpheios/Greek/steminds/nomind
          cmake -E sha256sum build/data-test-alpheios/gener.index | \
            grep -F '5aa76d8c86c54af5121a3cce506ecaa57d14c6667ac0f091efd164ddfa9822d6'
          test -f build/data-test-perseids/Latin/steminds/nomind

      - name: Smoke-test benchmark runner
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/dev/libmorpheus.so
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
          MORPHEUS_CRUNCHER: ${{ github.workspace }}/build/dev/cruncher
        run: |
          ctest --test-dir build/dev --output-on-failure -R '^gener_corpus$'
          cp build/dev/test-gener-corpus/first.mgi stemlib/gener.index
          deno run --allow-env --allow-ffi --allow-read --allow-run \
            bench/compare.ts --iterations 1 --warmup 0 --contexts 1 \
            --cold-samples 1 --generation-small 'lo/gos' \
            --generation-maximal 'i(/hmi' --json > /dev/null

  deno-gener-preparer:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:4.0.15
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Install supported CMake
        run: |
          python3 -m pip install --user cmake==3.31.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure WebAssembly preparer
        run: >-
          emcmake cmake -S . -B build/deno-gener-wasm
          -DBUILD_TESTING=OFF
          -DMORPHEUS_BUILD_DENO_GENER_PREPARER=ON

      - name: Build WebAssembly preparer
        run: |
          cmake --build build/deno-gener-wasm \
            --target morpheus_gener_source_preparer
          cmp build/deno-gener-wasm/gener_preparer.mjs \
            bindings/deno/gener_preparer.mjs

      - name: Upload WebAssembly preparer
        uses: actions/upload-artifact@v4
        with:
          name: deno-gener-preparer
          path: build/deno-gener-wasm/gener_preparer.mjs
          if-no-files-found: error

  char-signedness:
    if: github.event_name == 'push'
    name: Byte conversions (${{ matrix.char_mode }} char)
    strategy:
      matrix:
        char_mode: [signed, unsigned]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Configure
        env:
          CFLAGS: -f${{ matrix.char_mode }}-char
        run: cmake -S . -B build/char-mode -G Ninja

      - name: Build byte portability tests
        run: >-
          cmake --build build/char-mode --target
          morpheus_byte_conversion_test morpheus_byte_collation_test

      - name: Test byte portability
        run: |
          ./build/char-mode/morpheus_byte_conversion_test
          ./build/char-mode/morpheus_byte_collation_test

  legacy-make:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build runtime with the inherited Makefiles
        run: |
          make -C src clean
          CFLAGS='-std=c17 -fcommon' make -C src libs
          CFLAGS='-std=c17 -fcommon' make -C src/anal cruncher
