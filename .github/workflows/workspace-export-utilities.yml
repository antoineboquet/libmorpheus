name: Export utility-audit workspace
on:
  pull_request:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-utility-audit
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
