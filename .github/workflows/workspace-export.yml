name: Export workspace
on:
  push:
    branches:
      - agent/workspace-export
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-workspace
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
