name: Platform and release qualification

on:
  pull_request:
    paths:
      - '.github/workflows/platform.yml'
      - 'CMakeLists.txt'
      - 'test/test-installed-package.cmake'
      - 'test/test-installed-pkgconfig.cmake'
      - 'test/test-release-package.cmake'
      - 'test/package-deno-binding.cmake'
      - 'test/test-deno-binding-package.cmake'
      - 'bindings/deno/**'
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      package_artifacts:
        description: Build and verify the three native release-candidate packages
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ ! startsWith(github.ref, 'refs/tags/') }}

jobs:
  activity:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      package-artifacts: ${{ steps.activity.outputs.package-artifacts }}
      run-platforms: ${{ steps.activity.outputs.run-platforms }}
    steps:
      - name: Decide whether platform qualification is required
        id: activity
        uses: actions/github-script@v8
        with:
          script: |
            const packageArtifacts = context.eventName === 'pull_request' ||
              context.ref.startsWith('refs/tags/') ||
              (context.eventName === 'workflow_dispatch' &&
                String(context.payload.inputs?.package_artifacts) === 'true')
            core.setOutput('package-artifacts', String(packageArtifacts))

            if (context.eventName === 'pull_request') {
              core.info(
                'Validate the Linux x86-64 package without running costly ' +
                'architecture jobs.',
              )
              core.setOutput('run-platforms', 'false')
              return
            }

            if (context.eventName !== 'schedule') {
              core.info('Manual and version-tag runs always qualify platforms.')
              core.setOutput('run-platforms', 'true')
              return
            }

            const current = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            })
            const history = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: current.data.workflow_id,
              event: 'schedule',
              per_page: 10,
            })
            const previous = history.data.workflow_runs.find((run) =>
              run.id !== context.runId && run.status === 'completed'
            )
            const runPlatforms = previous === undefined ||
              previous.head_sha !== context.sha ||
              previous.conclusion !== 'success'

            if (previous === undefined) {
              core.info('No previous scheduled run exists; qualify platforms.')
            } else {
              core.info(
                `Previous scheduled run: ${previous.id}, ` +
                `SHA ${previous.head_sha}, conclusion ${previous.conclusion}.`,
              )
              core.info(`Current SHA: ${context.sha}.`)
            }
            core.setOutput('run-platforms', String(runPlatforms))

  linux-x86_64-package:
    needs: activity
    if: needs.activity.outputs.package-artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Configure optimized release
        run: >-
          cmake --preset release -DBUILD_TESTING=ON
          -DMORPHEUS_PACKAGE_PLATFORM=Linux-x86_64-glibc

      - name: Build optimized release
        run: cmake --build --preset release

      - name: Test optimized release and installed surface
        run: ctest --preset release

      - name: Verify native library architecture and dependencies
        run: |
          library="$(readlink -f build/release/libmorpheus.so)"
          file "$library"
          readelf -h "$library" | grep -F 'Machine:' | \
            grep -F 'Advanced Micro Devices X86-64'
          if ldd "$library" | grep -F 'not found'; then
            exit 1
          fi

      - name: Package optimized release
        run: >-
          cpack --config build/release/CPackConfig.cmake
          -G TGZ -B build/release/packages

      - name: Verify native package
        run: >-
          cmake
          -DMORPHEUS_BUILD_DIR=${{ github.workspace }}/build/release
          -DMORPHEUS_PACKAGE_DIR=${{ github.workspace }}/build/release/packages
          -P test/test-release-package.cmake

      - name: Package Deno binding
        run: >-
          cmake
          -DMORPHEUS_SOURCE_DIR=${{ github.workspace }}
          -DMORPHEUS_BUILD_DIR=${{ github.workspace }}/build/release
          -DMORPHEUS_PACKAGE_DIR=${{ github.workspace }}/build/release/packages
          -P test/package-deno-binding.cmake

      - name: Verify standalone Deno binding package
        run: >-
          cmake
          -DMORPHEUS_BUILD_DIR=${{ github.workspace }}/build/release
          -DMORPHEUS_PACKAGE_DIR=${{ github.workspace }}/build/release/packages
          -P test/test-deno-binding-package.cmake

      - name: Preserve native package
        uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-native-linux-x86_64
          path: build/release/packages/libmorpheus-[0-9]*.tar.gz*
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Deno binding package
        uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-deno-binding
          path: build/release/packages/libmorpheus-deno-*.tar.gz*
          if-no-files-found: error
          retention-days: 14

  linux-aarch64:
    needs: activity
    if: needs.activity.outputs.run-platforms == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify native architecture
        run: test "$(uname -m)" = aarch64

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Configure optimized release
        run: >-
          cmake --preset release -DBUILD_TESTING=ON
          -DMORPHEUS_PACKAGE_PLATFORM=Linux-aarch64-glibc

      - name: Build optimized release
        run: cmake --build --preset release

      - name: Test native runtime and installed surface
        run: ctest --preset release

      - name: Verify native library architecture and dependencies
        run: |
          library="$(readlink -f build/release/libmorpheus.so)"
          file "$library"
          readelf -h "$library" | grep -F 'Machine:' | grep -F AArch64
          if ldd "$library" | grep -F 'not found'; then
            exit 1
          fi

      - name: Check binding
        run: deno check bindings/deno/mod.ts bindings/deno/mod_test.ts

      - name: Test binding
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/release/libmorpheus.so
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
        run: deno test --allow-env --allow-ffi bindings/deno/mod_test.ts

      - name: Package release candidate
        if: needs.activity.outputs.package-artifacts == 'true'
        run: >-
          cpack --config build/release/CPackConfig.cmake
          -G TGZ -B build/release/packages

      - name: Verify native release-candidate package
        if: needs.activity.outputs.package-artifacts == 'true'
        run: >-
          cmake
          -DMORPHEUS_BUILD_DIR=${{ github.workspace }}/build/release
          -DMORPHEUS_PACKAGE_DIR=${{ github.workspace }}/build/release/packages
          -P test/test-release-package.cmake

      - name: Preserve native release-candidate package
        if: needs.activity.outputs.package-artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-native-linux-aarch64-glibc
          path: build/release/packages/libmorpheus-*.tar.gz*
          if-no-files-found: error
          retention-days: 14

  alpine:
    needs: activity
    if: needs.activity.outputs.run-platforms == 'true'
    name: Alpine (${{ matrix.architecture }})
    strategy:
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Build and test Alpine runtime image
        run: docker build --target runtime --tag morpheus:ci .

      - name: Smoke-test cruncher image
        run: |
          output="$(printf 'a)/nqrwpos\n' | docker run --rm -i morpheus:ci -S)"
          test -n "$output"

      - name: Build Alpine Deno base image
        run: docker build --target deno-runtime --tag morpheus-deno:ci .

      - name: Smoke-test Deno base image
        run: docker run --rm morpheus-deno:ci --version

  apple-silicon:
    needs: activity
    if: needs.activity.outputs.run-platforms == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify native architecture
        run: test "$(uname -m)" = arm64

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Configure optimized release
        run: >-
          cmake --preset release -DBUILD_TESTING=ON
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DMORPHEUS_PACKAGE_PLATFORM=macOS-arm64

      - name: Build optimized release
        run: cmake --build --preset release

      - name: Test native runtime and installed surface
        run: ctest --preset release

      - name: Verify dynamic-library contract
        run: |
          library=build/release/libmorpheus.dylib
          test "$(lipo -archs "$library")" = arm64
          otool -D "$library" | tail -n +2 | \
            grep -E '^@rpath/libmorpheus(\.0)?\.dylib$'
          if otool -L "$library" | grep -F '${{ github.workspace }}'; then
            exit 1
          fi
          deployment_target="$(
            otool -l "$library" |
              awk '$1 == "cmd" && $2 == "LC_BUILD_VERSION" { found = 1 }
                   found && $1 == "minos" { print $2; exit }'
          )"
          case "$deployment_target" in
            11.0|11.0.*) ;;
            *) echo "unexpected deployment target: $deployment_target" >&2; exit 1 ;;
          esac

      - name: Check binding
        run: deno check bindings/deno/mod.ts bindings/deno/mod_test.ts

      - name: Test binding
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/release/libmorpheus.dylib
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
        run: deno test --allow-env --allow-ffi bindings/deno/mod_test.ts

      - name: Package release candidate
        if: needs.activity.outputs.package-artifacts == 'true'
        run: >-
          cpack --config build/release/CPackConfig.cmake
          -G TGZ -B build/release/packages

      - name: Verify native release-candidate package
        if: needs.activity.outputs.package-artifacts == 'true'
        run: >-
          cmake
          -DMORPHEUS_BUILD_DIR=${{ github.workspace }}/build/release
          -DMORPHEUS_PACKAGE_DIR=${{ github.workspace }}/build/release/packages
          -P test/test-release-package.cmake

      - name: Preserve native release-candidate package
        if: needs.activity.outputs.package-artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-native-macos-arm64
          path: build/release/packages/libmorpheus-*.tar.gz*
          if-no-files-found: error
          retention-days: 14
