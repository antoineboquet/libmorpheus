name: Published JSR smoke test

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Published @humanities/libmorpheus version
        required: true
        default: 0.3.0
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.package_version }}
  cancel-in-progress: false

jobs:
  published-jsr-smoke:
    name: Install native and data from public endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out smoke-test source
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Create a clean JSR application
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          case "$PACKAGE_VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid package version: $PACKAGE_VERSION" >&2; exit 1 ;;
          esac
          smoke_root="$RUNNER_TEMP/libmorpheus-jsr-smoke"
          deno init "$smoke_root"
          cd "$smoke_root"
          deno add "jsr:@humanities/libmorpheus@$PACKAGE_VERSION"
          cp "$GITHUB_WORKSPACE/test/jsr-published-smoke.ts" smoke.ts

      - name: Acquire the published native library
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          deno x \
            --allow-net=github.com,release-assets.githubusercontent.com \
            --allow-read="$RUNNER_TEMP/morpheus-native" \
            --allow-write="$RUNNER_TEMP/morpheus-native" \
            "jsr:@humanities/libmorpheus@$PACKAGE_VERSION/native" \
            --output "$RUNNER_TEMP/morpheus-native"

      - name: Acquire Alpheios data and generation index
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          deno x \
            --allow-net=codeload.github.com \
            --allow-read="$RUNNER_TEMP/morpheus-alpheios" \
            --allow-write="$RUNNER_TEMP/morpheus-alpheios" \
            "jsr:@humanities/libmorpheus@$PACKAGE_VERSION/data" \
            --dataset alpheios \
            --with-gener \
            --output "$RUNNER_TEMP/morpheus-alpheios"

      - name: Acquire Perseids Greek and Latin data
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          deno x \
            --allow-net=codeload.github.com \
            --allow-read="$RUNNER_TEMP/morpheus-perseids" \
            --allow-write="$RUNNER_TEMP/morpheus-perseids" \
            "jsr:@humanities/libmorpheus@$PACKAGE_VERSION/data" \
            --dataset perseids \
            --output "$RUNNER_TEMP/morpheus-perseids"

      - name: Analyze Greek and Latin and generate Greek forms
        run: |
          cd "$RUNNER_TEMP/libmorpheus-jsr-smoke"
          deno run --allow-ffi smoke.ts \
            "$RUNNER_TEMP/morpheus-native" \
            "$RUNNER_TEMP/morpheus-alpheios" \
            "$RUNNER_TEMP/morpheus-perseids"
